[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dmgan-session6"
version = "0.1.0"
description = "Faithful modern PyTorch DM-GAN baseline for the Session 6 milestone"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "torch==2.12.0",
  "torchvision==0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
download = ["gdown>=5,<6"]

[tool.setuptools.packages.find]
include = ["dmgan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
